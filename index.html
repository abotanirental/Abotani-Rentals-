<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abotani Rentals | Book Now</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-gray-50 font-sans">
    <div class="max-w-md mx-auto p-6 bg-white shadow-lg min-h-screen">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-orange-600">🚀 Abotani Rentals</h1>
            <p class="text-gray-500">Fast & Reliable Two-Wheeler Booking</p>
        </header>

        <form id="bookingForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium">Full Name</label>
                <input type="text" id="custName" required class="w-full border p-2 rounded">
            </div>
            <div>
                <label class="block text-sm font-medium">Address</label>
                <textarea id="custAddress" required class="w-full border p-2 rounded"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium">Aadhaar (12 digits)</label>
                    <input type="number" id="custAadhaar" required class="w-full border p-2 rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium">WhatsApp No</label>
                    <input type="number" id="custPhone" required class="w-full border p-2 rounded">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium">Vehicle</label>
                    <select id="vehicleType" class="w-full border p-2 rounded">
                        <option value="Scooty" data-price="699">Scooty (₹699)</option>
                        <option value="Bike" data-price="799">Bike (₹799)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium">Start Date</label>
                    <input type="date" id="bookingDate" required class="w-full border p-2 rounded">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium">Number of Days</label>
                <input type="number" id="numDays" min="1" value="1" required class="w-full border p-2 rounded">
            </div>

            <div id="statusMsg" class="text-center font-bold hidden"></div>

            <button type="button" id="checkBtn" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">
                Check Availability
            </button>

            <button type="button" id="payBtn" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold hidden">
                Pay Now (₹<span id="totalDisplay">0</span>)
            </button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- CONFIGURATION ---
        const firebaseConfig = { /* YOUR FIREBASE CONFIG HERE */ };
        const RAZORPAY_KEY = "rzp_test_XXXXXXXXXXXX"; // Replace with Live Key later
        const ADMIN_PHONE = "918798394440";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- ELEMENTS ---
        const checkBtn = document.getElementById('checkBtn');
        const payBtn = document.getElementById('payBtn');
        const statusMsg = document.getElementById('statusMsg');

        // --- LOGIC: AVAILABILITY ---
        checkBtn.onclick = async () => {
            const date = document.getElementById('bookingDate').value;
            const vehicle = document.getElementById('vehicleType').value;
            
            if(!date) return alert("Please select a date");

            // Check bookings & blocked collections
            const qBooked = query(collection(db, "bookings"), where("date", "==", date), where("vehicle", "==", vehicle));
            const qBlocked = query(collection(db, "blocked"), where("date", "==", date));

            const [snapBooked, snapBlocked] = await Promise.all([getDocs(qBooked), getDocs(qBlocked)]);

            if (!snapBooked.empty || !snapBlocked.empty) {
                statusMsg.innerText = "❌ Not Available for this date";
                statusMsg.className = "text-center font-bold text-red-600 block";
                payBtn.classList.add('hidden');
            } else {
                statusMsg.innerText = "✅ Available!";
                statusMsg.className = "text-center font-bold text-green-600 block";
                
                const price = document.getElementById('vehicleType').selectedOptions[0].dataset.price;
                const days = document.getElementById('numDays').value;
                document.getElementById('totalDisplay').innerText = price * days;
                
                payBtn.classList.remove('hidden');
                checkBtn.classList.add('hidden');
            }
        };

        // --- LOGIC: RAZORPAY ---
        payBtn.onclick = () => {
            const amount = document.getElementById('totalDisplay').innerText;
            
            const options = {
                "key": RAZORPAY_KEY,
                "amount": amount * 100, // in paise
                "currency": "INR",
                "name": "Abotani Rentals",
                "handler": function (response) {
                    saveBooking(response.razorpay_payment_id);
                },
                "prefill": {
                    "contact": document.getElementById('custPhone').value
                },
                "theme": { "color": "#EA580C" }
            };
            const rzp = new Razorpay(options);
            rzp.open();
        };

        // --- LOGIC: SAVE & WHATSAPP ---
        async function saveBooking(payId) {
            const data = {
                name: document.getElementById('custName').value,
                phone: document.getElementById('custPhone').value,
                vehicle: document.getElementById('vehicleType').value,
                date: document.getElementById('bookingDate').value,
                days: document.getElementById('numDays').value,
                total: document.getElementById('totalDisplay').innerText,
                paymentId: payId,
                timestamp: new Date()
            };

            await addDoc(collection(db, "bookings"), data);

            const msg = `Booking Confirmed!\nName: ${data.name}\nVehicle: ${data.vehicle}\nDate: ${data.date}\nTotal: ₹${data.total}`;
            
            // Open Admin WhatsApp immediately
            window.open(`https://wa.me/${ADMIN_PHONE}?text=${encodeURIComponent("NEW BOOKING: " + msg)}`, '_blank');
            alert("Payment Successful! Booking Confirmed.");
            location.reload();
        }
    </script>
</body>
</html>
