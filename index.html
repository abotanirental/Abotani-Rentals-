<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abotani Rentals | Book Now</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body class="bg-gray-50 font-sans">

<div class="max-w-md mx-auto p-6 bg-white shadow-lg min-h-screen">

  <!-- 🔥 LOGO (ADMIN CAN CHANGE IMAGE FILE) -->
  <div class="text-center mb-4">
    <img src="logo.png" alt="Logo" class="w-24 h-24 mx-auto rounded-xl shadow-md object-contain">
  </div>

  <h1 class="text-3xl font-bold text-orange-600 text-center mb-6">
    Abotani Rentals
  </h1>

  <div class="space-y-4">

    <input id="custName" placeholder="Full Name" class="w-full border p-2 rounded" required>
    <input id="custPhone" placeholder="WhatsApp Number" class="w-full border p-2 rounded" required>

    <select id="vehicleType" class="w-full border p-2 rounded">
      <option value="Scooty" data-price="699">Scooty ₹699</option>
      <option value="Bike" data-price="799">Bike ₹799</option>
    </select>

    <input type="date" id="bookingDate" class="w-full border p-2 rounded" required>
    <input type="number" id="numDays" value="1" min="1" class="w-full border p-2 rounded">

    <button onclick="checkAndPay()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold">
      Check & Pay
    </button>

  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 🔥 CONFIG
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const RAZORPAY_KEY = "YOUR_RAZORPAY_KEY";
const FUNCTION_BASE = "https://YOUR_PROJECT.cloudfunctions.net";

// 🔥 ADMIN PHONE (FIXED)
const ADMIN_PHONE = "918798394440";

// INVENTORY
const inventory = {
  Scooty: 5,
  Bike: 3
};

// CHECK AVAILABILITY
async function isAvailable(date, vehicle) {
  const q = query(collection(db, "bookings"), where("date", "==", date), where("vehicle", "==", vehicle));
  const snap = await getDocs(q);

  if (snap.size >= inventory[vehicle]) return false;

  const qBlocked = query(collection(db, "blocked"), where("date", "==", date));
  const blocked = await getDocs(qBlocked);

  return blocked.empty;
}

// MAIN FLOW
window.checkAndPay = async () => {

  const date = document.getElementById('bookingDate').value;
  const vehicle = document.getElementById('vehicleType').value;
  const days = parseInt(document.getElementById('numDays').value);
  const price = document.getElementById('vehicleType').selectedOptions[0].dataset.price;

  if (!date) return alert("Select date");

  const available = await isAvailable(date, vehicle);
  if (!available) return alert("Not Available");

  const total = price * days;

  // CREATE ORDER
  const orderRes = await fetch(`${FUNCTION_BASE}/createOrder`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ amount: total })
  });

  const order = await orderRes.json();

  const options = {
    key: RAZORPAY_KEY,
    amount: order.amount,
    currency: "INR",
    order_id: order.id,

    handler: async function (response) {

      const verifyRes = await fetch(`${FUNCTION_BASE}/verifyPayment`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(response)
      });

      const result = await verifyRes.json();

      if (!result.success) return alert("Payment Failed");

      await saveBooking(response.razorpay_payment_id, total);
    }
  };

  new Razorpay(options).open();
};

// SAVE BOOKING
async function saveBooking(paymentId, total) {

  const data = {
    name: document.getElementById('custName').value,
    phone: document.getElementById('custPhone').value,
    vehicle: document.getElementById('vehicleType').value,
    date: document.getElementById('bookingDate').value,
    days: document.getElementById('numDays').value,
    total,
    paymentId,
    status: "paid",
    timestamp: new Date()
  };

  const available = await isAvailable(data.date, data.vehicle);
  if (!available) return alert("Slot just got booked");

  await addDoc(collection(db, "bookings"), data);

  // 🔥 WHATSAPP TO ADMIN
  window.open(`https://wa.me/${ADMIN_PHONE}?text=New Booking ${encodeURIComponent(JSON.stringify(data))}`);

  alert("Booking Confirmed");
  location.reload();
}

</script>

</body>
</html>
