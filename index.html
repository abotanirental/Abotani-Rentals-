<!DOCTYPE html>
<html>
<head>
  <title>Abotani Rentals</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body { font-family: Arial; background:#f5f5f5; margin:0; }
    .container {
      max-width:400px; margin:auto; background:white;
      padding:20px; border-radius:15px; margin-top:20px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }
    input, select {
      width:100%; padding:12px; margin:8px 0;
      border-radius:8px; border:1px solid #ccc;
    }
    .btn {
      width:100%; padding:14px; margin-top:10px;
      border:none; border-radius:10px; color:white;
    }
    .whatsapp{background:#25D366;}
    .pay{background:black;}
    .email{background:#007bff;}
    .receipt{background:#444;}
    .total{font-weight:bold; text-align:center;}
    #availability{font-weight:bold; text-align:center;}
  </style>
</head>

<body>

<div class="container">

<h2>🛵 Abotani Rentals</h2>

<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<input id="email" placeholder="Email">

<select id="vehicle" onchange="calcTotal(); checkAvailability()">
  <option value="">Select Vehicle</option>
  <option value="699">Scooty - ₹699/day</option>
  <option value="799">Bike - ₹799/day</option>
</select>

<input type="date" id="date" onchange="checkAvailability()">
<input type="number" id="days" placeholder="Days" oninput="calcTotal()">

<div class="total" id="total">Total: ₹0</div>
<div id="availability"></div>

<button class="btn whatsapp" onclick="bookWhatsApp()">WhatsApp</button>
<button class="btn pay" onclick="payNow()">Pay</button>
<button class="btn email" onclick="sendEmail()">Email</button>
<button class="btn receipt" onclick="printReceipt()">Receipt</button>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Get Details
function getDetails(){
  let name=name.value, phone=phone.value, email=email.value;
  let v=document.getElementById("vehicle");
  let vehicleText=v.options[v.selectedIndex].text;
  let price=v.value;
  let date=date.value, days=days.value;

  if(!name||!phone||!email||!price||!date||!days){
    alert("Fill all"); return null;
  }

  return {name,phone,email,vehicleText,price,date,days,total:price*days};
}

// Total
function calcTotal(){
  let p=vehicle.value, d=days.value;
  if(p&&d) total.innerText="Total: ₹"+(p*d);
}

// Availability
async function checkAvailability(){
  let v=vehicle.options[vehicle.selectedIndex].text;
  let d=date.value;
  if(!v||!d) return;

  let snap=await db.collection("bookings")
    .where("vehicleText","==",v)
    .where("date","==",d).get();

  if(!snap.empty){
    availability.innerText="❌ Not Available";
    availability.style.color="red";
  }else{
    availability.innerText="✅ Available";
    availability.style.color="green";
  }
}

// Save Booking
async function saveBooking(d){
  await db.collection("bookings").add(d);
}

// WhatsApp Booking
async function bookWhatsApp(){
  let d=getDetails(); if(!d) return;

  let snap=await db.collection("bookings")
    .where("vehicleText","==",d.vehicleText)
    .where("date","==",d.date).get();

  if(!snap.empty){ alert("Not available"); return; }

  await saveBooking(d);

  let msg=`Name:${d.name}
Vehicle:${d.vehicleText}
Days:${d.days}
Date:${d.date}
Total:₹${d.total}`;

  window.open("https://wa.me/918798394440?text="+encodeURIComponent(msg));
}

// UPI
function payNow(){
  let d=getDetails(); if(!d) return;
  window.open(`upi://pay?pa=nanayukar@oksbi&am=${d.total}&cu=INR`);
}

// Email
function sendEmail(){
  let d=getDetails(); if(!d) return;

  let body=`Name:${d.name}
Vehicle:${d.vehicleText}
Total:₹${d.total}`;

  window.location.href=
  `mailto:abotanirentals@gmail.com,${d.email}?body=${encodeURIComponent(body)}`;
}

// Receipt
function printReceipt(){
  let d=getDetails(); if(!d) return;

  let w=window.open('');
  w.document.write(`<h2>Receipt</h2>
  Name:${d.name}<br>
  Vehicle:${d.vehicleText}<br>
  Total:₹${d.total}`);
  w.print();
}
</script>

</body>
</html>
