<!DOCTYPE html>
<html>
<head>
  <title>Abotani Rentals</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="font-family:Arial; background:#f4f6f9; display:flex; justify-content:center; align-items:center; height:100vh;">

<div style="background:white; padding:20px; border-radius:12px; width:340px; box-shadow:0 10px 20px rgba(0,0,0,0.1);">

<h2>🛵 Abotani Rentals</h2>

<input id="name" placeholder="Full Name"><br>
<input id="address" placeholder="Address"><br>
<input id="aadhaar" placeholder="Aadhaar Number (12 digits)"><br>
<input id="phone" placeholder="WhatsApp Number"><br>

<select id="vehicle">
<option value="699">Scooty ₹699/day</option>
<option value="799">Bike ₹799/day</option>
</select><br>

<input type="date" id="date"><br>
<input type="number" id="days" placeholder="Days (min 1)"><br>

<h3 id="total">Total: ₹0</h3>
<p id="status"></p>

<button onclick="checkAvailability()">Check Availability</button>
<button id="payBtn" onclick="bookNow()" style="display:none;">Pay & Book</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, where, getDocs } 
from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

// ✅ YOUR REAL CONFIG (ALREADY ADDED)
const firebaseConfig = {
  apiKey: "AIzaSyASIPoPxWTP46q8c2rEE418uzSBQgg8cMo",
  authDomain: "abotani-rental.firebaseapp.com",
  projectId: "abotani-rental",
  storageBucket: "abotani-rental.firebasestorage.app",
  messagingSenderId: "823152338461",
  appId: "1:823152338461:web:963a771468499ae7a588f4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// GET DATA
function getData(){
  const name = document.getElementById("name").value;
  const address = document.getElementById("address").value;
  const aadhaar = document.getElementById("aadhaar").value;
  const phone = document.getElementById("phone").value;
  const vehicle = document.getElementById("vehicle").value;
  const date = document.getElementById("date").value;
  const days = parseInt(document.getElementById("days").value);

  if(!name || !phone || !date || days < 1){
    alert("Fill all fields (minimum 1 day required)");
    return null;
  }

  if(aadhaar.length !== 12){
    alert("Aadhaar must be 12 digits");
    return null;
  }

  const total = vehicle * days;
  document.getElementById("total").innerText = "Total: ₹" + total;

  return {name, address, aadhaar, phone, vehicle, date, days, total};
}

// CHECK AVAILABILITY
window.checkAvailability = async function(){
  const d = getData();
  if(!d) return;

  const q = query(collection(db,"bookings"), where("date","==",d.date));
  const snapshot = await getDocs(q);

  if(snapshot.empty){
    document.getElementById("status").innerText = "✅ Available";
    document.getElementById("payBtn").style.display = "block";
  } else {
    document.getElementById("status").innerText = "❌ Not Available";
    document.getElementById("payBtn").style.display = "none";
  }
}

// BOOK + PAYMENT + WHATSAPP
window.bookNow = async function(){
  const d = getData();
  if(!d) return;

  await addDoc(collection(db,"bookings"), d);

  // UPI
  window.location.href = `upi://pay?pa=nanayukar@oksbi&pn=Abotani Rentals&am=${d.total}&cu=INR`;

  const msg = `Booking Confirmed!
Name: ${d.name}
Date: ${d.date}
Days: ${d.days}
Total: ₹${d.total}`;

  // Customer WhatsApp
  window.open(`https://wa.me/91${d.phone}?text=${encodeURIComponent(msg)}`);

  // Admin WhatsApp
  window.open(`https://wa.me/918798394440?text=${encodeURIComponent(msg)}`);
}

</script>

</body>
</html>
