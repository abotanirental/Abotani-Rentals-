<!DOCTYPE html>
<html>
<head>
<title>Abotani Rentals</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
body {
  font-family: Arial;
  background: #f4f6f9;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  width: 350px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}
input, select {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
}
button {
  width: 100%;
  padding: 12px;
  margin-top: 5px;
  border: none;
  color: white;
}
.check { background: #007bff; }
.pay { background: #25D366; }
</style>
</head>

<body>

<div class="card">

<h2>🚲 Abotani Rentals</h2>

<input id="name" placeholder="Full Name">
<input id="address" placeholder="Address">
<input id="aadhaar" placeholder="Aadhaar Number">
<input id="phone" placeholder="WhatsApp Number">

<select id="vehicle">
  <option value="699">Scooty ₹699/day</option>
  <option value="799">Bike ₹799/day</option>
</select>

<input type="date" id="date">
<input type="number" id="days" placeholder="Days (min 1)">

<h3 id="total">Total: ₹0</h3>
<p id="status"></p>

<button class="check" onclick="checkAvailability()">Check Availability</button>
<button id="payBtn" class="pay" onclick="bookNow()" style="display:none;">Pay & Book</button>

</div>

<script>

// 🔥 YOUR FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyASIPoPxWTP46q8c2rEE418uzSBQgg8cMo",
  authDomain: "abotani-rental.firebaseapp.com",
  projectId: "abotani-rental",
  storageBucket: "abotani-rental.firebasestorage.app",
  messagingSenderId: "823152338461",
  appId: "1:823152338461:web:963a771468499ae7a588f4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// GET DATA
function getData(){
  let name = document.getElementById("name").value;
  let address = document.getElementById("address").value;
  let aadhaar = document.getElementById("aadhaar").value;
  let phone = document.getElementById("phone").value;
  let vehicle = document.getElementById("vehicle").value;
  let date = document.getElementById("date").value;
  let days = parseInt(document.getElementById("days").value);

  if(!name || !phone || !date || days < 1){
    alert("Fill all details (minimum 1 day)");
    return null;
  }

  let total = vehicle * days;
  document.getElementById("total").innerText = "Total: ₹" + total;

  return {name,address,aadhar,phone,vehicle,date,days,total};
}

// CHECK AVAILABILITY
function checkAvailability(){
  let d = getData();
  if(!d) return;

  // check blocked dates
  db.collection("blocked").where("date","==",d.date).get()
  .then(blockSnap => {

    if(!blockSnap.empty){
      status.innerText = "❌ Blocked by admin";
      status.style.color = "red";
      payBtn.style.display = "none";
      return;
    }

    // check bookings
    db.collection("bookings").where("date","==",d.date).get()
    .then(snapshot => {

      if(snapshot.empty){
        status.innerText = "✅ Available";
        status.style.color = "green";
        payBtn.style.display = "block";
      } else {
        status.innerText = "❌ Not Available";
        status.style.color = "red";
        payBtn.style.display = "none";
      }

    });

  });
}

// BOOK NOW
function bookNow(){
  let d = getData();
  if(!d) return;

  db.collection("bookings").add(d);

  // UPI Payment
  window.location.href = `upi://pay?pa=nanayukar@oksbi&pn=Abotani Rentals&am=${d.total}&cu=INR`;

  let msg = `Booking Confirmed
Name: ${d.name}
Date: ${d.date}
Days: ${d.days}
Total: ₹${d.total}`;

  // WhatsApp to customer
  window.open(`https://wa.me/91${d.phone}?text=${encodeURIComponent(msg)}`);

  // WhatsApp to admin
  window.open(`https://wa.me/918798394440?text=${encodeURIComponent(msg)}`);
}

</script>

</body>
</html>
