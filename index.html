<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Abotani Rentals - Ride Swift and Safe</title>
    <link rel="stylesheet" href="style.css">
    <!-- Razorpay SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header with Logo -->
        <div class="header">
            <img src="logo.png" alt="Abotani Rentals Logo" class="logo" onerror="this.style.display='none'">
            <h1>Abotani Rentals</h1>
            <p class="tagline">Ride Swift and Safe • Itanagar</p>
        </div>

        <!-- Booking Form -->
        <form id="bookingForm" class="booking-form">
            <h2>Book Your Scooty</h2>
            
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="fullName" required>
            </div>

            <div class="form-group">
                <label>Address *</label>
                <textarea id="address" rows="2" required></textarea>
            </div>

            <div class="form-group">
                <label>Aadhaar Card Number *</label>
                <input type="text" id="aadhaar" maxlength="12" pattern="[0-9]{12}" placeholder="123456789012" required>
                <small>Full Aadhaar number will be stored for security and legal purposes (legal requirement)</small>
            </div>

            <div class="form-group">
                <label>Phone Number *</label>
                <input type="tel" id="phone" maxlength="10" pattern="[0-9]{10}" placeholder="10 digits" required>
            </div>

            <div class="form-group">
                <label>Driving License Number *</label>
                <input type="text" id="dlNumber" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Start Date *</label>
                    <input type="date" id="startDate" required>
                </div>
                <div class="form-group">
                    <label>Number of Days *</label>
                    <input type="number" id="days" min="1" max="30" value="1" required>
                </div>
            </div>

            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="consent" required>
                    I confirm that all details provided are correct. I understand that the full Aadhaar number is not stored digitally for legal compliance, and I am responsible for the vehicle during the rental period.
                </label>
            </div>

            <!-- Availability Display -->
            <div id="availabilityResult" class="availability-box hidden"></div>

            <!-- Pay Button (hidden until availability checked) -->
            <button type="button" id="payBtn" class="pay-btn hidden" disabled>Pay to Book</button>
        </form>

        <div class="contact">
            <p>📞 For support: 8798394440</p>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
