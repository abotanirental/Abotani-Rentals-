<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abotani Rentals - Simple Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #1e3c72;
            margin-bottom: 10px;
        }
        .login-box {
            max-width: 400px;
            margin: 50px auto;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #1e3c72;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #2a5298;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #1e3c72;
            color: white;
        }
        .logout-btn {
            background: red;
            width: auto;
            padding: 8px 20px;
            margin-top: 20px;
        }
        .stats {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }
        .stats h3 {
            font-size: 14px;
            opacity: 0.9;
        }
        .stats .value {
            font-size: 36px;
            font-weight: bold;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .nav-btn {
            width: auto;
            background: #764ba2;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Abotani Rentals Admin</h1>
        <p>Ride Swift and Safe • Delhi</p>

        <!-- Login Section -->
        <div id="loginSection">
            <div class="login-box">
                <h2>Admin Login</h2>
                <input type="password" id="adminPass" placeholder="Enter Password">
                <button onclick="checkLogin()">Login</button>
                <div id="loginError" class="error"></div>
            </div>
        </div>

        <!-- Admin Panel (hidden until login) -->
        <div id="adminSection" class="hidden">
            <div class="nav-buttons">
                <button class="nav-btn" onclick="showBookings()">📅 Bookings</button>
                <button class="nav-btn" onclick="showSlots()">🛵 Slot Management</button>
                <button class="nav-btn" onclick="showSettings()">⚙️ Settings</button>
                <button class="logout-btn" onclick="logout()">🚪 Logout</button>
            </div>

            <!-- Bookings View -->
            <div id="bookingsView">
                <div class="stats">
                    <h3>Total Bookings</h3>
                    <div class="value" id="totalBookings">0</div>
                </div>
                <div style="overflow-x: auto;">
                    <table id="bookingsTable">
                        <thead>
                            <tr><th>Name</th><th>Phone</th><th>Aadhaar</th><th>DL</th><th>Start Date</th><th>Days</th><th>Amount</th></tr>
                        </thead>
                        <tbody id="bookingsBody">
                            <tr><td colspan="7">No bookings yet</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Slot Management View -->
            <div id="slotsView" class="hidden">
                <h2>Slot Management</h2>
                <div style="margin: 20px 0;">
                    <label>Select Date:</label>
                    <input type="date" id="slotDate" style="width: auto;">
                    <button onclick="checkSlot()">Check Slots</button>
                </div>
                <div id="slotInfo" style="padding: 20px; background: #f0f0f0; border-radius: 10px;">
                    Select a date to see slot availability
                </div>
            </div>

            <!-- Settings View -->
            <div id="settingsView" class="hidden">
                <h2>Settings</h2>
                <div style="margin: 20px 0;">
                    <label>Change Password:</label>
                    <input type="password" id="newPass" placeholder="New password">
                    <input type="password" id="confirmPass" placeholder="Confirm password">
                    <button onclick="changePassword()">Update Password</button>
                </div>
                <div style="margin: 20px 0;">
                    <label>Price per Day (₹):</label>
                    <input type="number" id="pricePerDay" value="749">
                    <button onclick="updatePrice()">Update Price</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Simple in-memory storage for demo
        let adminPassword = "Itanagar@raga";
        
        // Sample data (replace with Firebase later)
        let bookings = JSON.parse(localStorage.getItem('abotani_bookings')) || [];
        
        function checkLogin() {
            const pass = document.getElementById('adminPass').value;
            if (pass === adminPassword) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminSection').classList.remove('hidden');
                showBookings();
            } else {
                document.getElementById('loginError').innerText = 'Wrong password!';
            }
        }
        
        function showBookings() {
            document.getElementById('bookingsView').classList.remove('hidden');
            document.getElementById('slotsView').classList.add('hidden');
            document.getElementById('settingsView').classList.add('hidden');
            loadBookings();
        }
        
        function showSlots() {
            document.getElementById('bookingsView').classList.add('hidden');
            document.getElementById('slotsView').classList.remove('hidden');
            document.getElementById('settingsView').classList.add('hidden');
        }
        
        function showSettings() {
            document.getElementById('bookingsView').classList.add('hidden');
            document.getElementById('slotsView').classList.add('hidden');
            document.getElementById('settingsView').classList.remove('hidden');
        }
        
        function loadBookings() {
            const stored = localStorage.getItem('abotani_bookings');
            bookings = stored ? JSON.parse(stored) : [];
            
            document.getElementById('totalBookings').innerText = bookings.length;
            
            const tbody = document.getElementById('bookingsBody');
            if (bookings.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7">No bookings yet</td></tr>';
            } else {
                tbody.innerHTML = bookings.map(b => `
                    <tr>
                        <td>${b.name || 'N/A'}</td>
                        <td>${b.phone || 'N/A'}</td>
                        <td>${b.aadhaar || 'N/A'}</td>
                        <td>${b.dlNumber || 'N/A'}</td>
                        <td>${b.startDate || 'N/A'}</td>
                        <td>${b.days || 0}</td>
                        <td>₹${b.amount || 0}</td>
                    </tr>
                `).join('');
            }
        }
        
        function checkSlot() {
            const date = document.getElementById('slotDate').value;
            if (!date) {
                document.getElementById('slotInfo').innerHTML = 'Please select a date';
                return;
            }
            document.getElementById('slotInfo').innerHTML = `
                <h3>${date}</h3>
                <p>Available Slots: 3 / 3</p>
                <p>Total Scooters: 3</p>
                <button onclick="alert('Feature: Connect to Firebase for live slot management')">Edit Slots</button>
            `;
        }
        
        function changePassword() {
            const newPass = document.getElementById('newPass').value;
            const confirmPass = document.getElementById('confirmPass').value;
            if (newPass !== confirmPass) {
                alert('Passwords do not match');
                return;
            }
            if (newPass.length < 4) {
                alert('Password must be at least 4 characters');
                return;
            }
            adminPassword = newPass;
            alert('Password changed for this session!');
            document.getElementById('newPass').value = '';
            document.getElementById('confirmPass').value = '';
        }
        
        function updatePrice() {
            const price = document.getElementById('pricePerDay').value;
            localStorage.setItem('abotani_price', price);
            alert(`Price updated to ₹${price} per day`);
        }
        
        function logout() {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('adminSection').classList.add('hidden');
            document.getElementById('adminPass').value = '';
        }
        
        // Add sample data for testing
        if (bookings.length === 0) {
            bookings = [
                { name: "Test Customer", phone: "9876543210", aadhaar: "1234XXXXXX78", dlNumber: "DL123456", startDate: "2026-04-05", days: 2, amount: 1498 }
            ];
            localStorage.setItem('abotani_bookings', JSON.stringify(bookings));
        }
    </script>
</body>
</html>
