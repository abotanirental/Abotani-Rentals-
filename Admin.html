<!DOCTYPE html>
<html>
<head>
<title>Abotani Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
body {
  font-family: Arial;
  background: #f4f6f9;
  padding: 10px;
}
.card {
  background: white;
  padding: 15px;
  margin: 10px;
  border-radius: 10px;
}
button {
  padding: 8px;
  border: none;
  color: white;
}
.delete { background: red; }
.block { background: black; }
</style>
</head>

<body>

<h2>📊 Abotani Admin Panel</h2>

<input type="date" id="blockDate">
<button class="block" onclick="blockDate()">Block Date</button>

<h3>Bookings</h3>
<div id="list"></div>

<script>

// 🔥 SAME FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyASIPoPxWTP46q8c2rEE418uzSBQgg8cMo",
  authDomain: "abotani-rental.firebaseapp.com",
  projectId: "abotani-rental",
  storageBucket: "abotani-rental.firebasestorage.app",
  messagingSenderId: "823152338461",
  appId: "1:823152338461:web:963a771468499ae7a588f4"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// LOAD BOOKINGS
function loadBookings(){
  db.collection("bookings").onSnapshot(snapshot => {

    let html = "";

    snapshot.forEach(doc => {
      let d = doc.data();

      html += `
        <div class="card">
          <p><b>Name:</b> ${d.name}</p>
          <p><b>Phone:</b> ${d.phone}</p>
          <p><b>Date:</b> ${d.date}</p>
          <p><b>Total:</b> ₹${d.total}</p>
          <button class="delete" onclick="deleteBooking('${doc.id}')">Delete</button>
        </div>
      `;
    });

    document.getElementById("list").innerHTML = html;
  });
}

// DELETE
function deleteBooking(id){
  db.collection("bookings").doc(id).delete();
}

// BLOCK DATE
function blockDate(){
  let date = document.getElementById("blockDate").value;
  if(!date){
    alert("Select date");
    return;
  }

  db.collection("blocked").add({date});
  alert("Date Blocked");
}

loadBookings();

</script>

</body>
</html>
