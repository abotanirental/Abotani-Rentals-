<!DOCTYPE html>
<html>
<head>
  <title>Abotani Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="font-family:Arial; background:#f4f6f9; padding:15px;">

<h2>🔐 Admin Panel - Abotani Rentals</h2>

<!-- LOGIN -->
<div id="loginBox">
  <input type="password" id="adminPass" placeholder="Enter Admin Password">
  <button onclick="login()">Login</button>
</div>

<!-- MAIN PANEL -->
<div id="panel" style="display:none;">

<h3>📊 Dashboard</h3>
<p id="stats"></p>

<hr>

<h3>📅 Block Date</h3>
<input type="date" id="blockDate">
<button onclick="blockDate()">Block</button>

<hr>

<h3>📦 Bookings</h3>
<div id="list"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, onSnapshot, deleteDoc, doc, addDoc } 
from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

// ✅ YOUR CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyASIPoPxWTP46q8c2rEE418uzSBQgg8cMo",
  authDomain: "abotani-rental.firebaseapp.com",
  projectId: "abotani-rental",
  storageBucket: "abotani-rental.firebasestorage.app",
  messagingSenderId: "823152338461",
  appId: "1:823152338461:web:963a771468499ae7a588f4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔐 LOGIN
window.login = function(){
  const pass = document.getElementById("adminPass").value;

  if(pass === "abotani@123"){
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("panel").style.display = "block";
    loadBookings();
  } else {
    alert("Wrong Password");
  }
}

// 📊 LOAD BOOKINGS (REAL-TIME)
function loadBookings(){
  onSnapshot(collection(db,"bookings"), (snapshot) => {

    let html = "";
    let total = 0;
    let count = 0;

    snapshot.forEach(docSnap => {
      const d = docSnap.data();
      const id = docSnap.id;

      total += Number(d.total);
      count++;

      html += `
        <div style="background:white; padding:10px; margin:10px 0; border-radius:8px;">
          <b>${d.name}</b><br>
          📅 ${d.date} | 🛵 ₹${d.total}<br>
          📞 ${d.phone}<br>
          <button onclick="deleteBooking('${id}')">Delete</button>
        </div>
      `;
    });

    document.getElementById("list").innerHTML = html;
    document.getElementById("stats").innerText =
      `Total Bookings: ${count} | Earnings: ₹${total}`;
  });
}

// ❌ DELETE BOOKING
window.deleteBooking = async function(id){
  await deleteDoc(doc(db,"bookings",id));
}

// 🚫 BLOCK DATE
window.blockDate = async function(){
  const date = document.getElementById("blockDate").value;

  if(!date){
    alert("Select date");
    return;
  }

  await addDoc(collection(db,"blocked"), {date});
  alert("Date blocked successfully");
}

</script>

</body>
</html>
