<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Abotani Rentals</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Abotani Rentals Admin</h1>
            <p>Ride Swift and Safe</p>
        </div>

        <div style="padding: 30px;">
            <!-- Login Form -->
            <div id="loginDiv">
                <h2>Admin Login</h2>
                <input type="password" id="passwordInput" placeholder="Enter Password" style="width: 100%; padding: 12px; margin: 10px 0;">
                <button id="loginBtn" style="width: 100%; padding: 12px; background: #1e3c72; color: white; border: none; border-radius: 8px;">Login</button>
                <div id="errorMsg" style="color: red; margin-top: 10px;"></div>
            </div>

            <!-- Admin Panel (hidden until login) -->
            <div id="adminPanel" style="display: none;">
                <h2>Welcome Admin</h2>
                
                <div class="stats-grid" style="margin: 20px 0;">
                    <div class="stat-card">
                        <h3>Total Bookings</h3>
                        <div class="value" id="totalCount">0</div>
                    </div>
                </div>

                <h3>All Bookings</h3>
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr style="background: #1e3c72; color: white;">
                                <th style="padding: 10px;">Name</th>
                                <th style="padding: 10px;">Phone</th>
                                <th style="padding: 10px;">Aadhaar</th>
                                <th style="padding: 10px;">DL</th>
                                <th style="padding: 10px;">Start Date</th>
                                <th style="padding: 10px;">Days</th>
                                <th style="padding: 10px;">Amount</th>
                            </tr>
                        </thead>
                        <tbody id="bookingsTable">
                            <tr><td colspan="7" style="text-align: center;">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>

                <button id="logoutBtn" style="margin-top: 20px; padding: 10px; background: red; color: white; border: none; border-radius: 8px;">Logout</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, collection, getDocs } from './firebase-config.js';

        const PASSWORD = "Itanagar@raga";

        document.getElementById('loginBtn').onclick = () => {
            const pass = document.getElementById('passwordInput').value;
            if (pass === PASSWORD) {
                document.getElementById('loginDiv').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadBookings();
            } else {
                document.getElementById('errorMsg').innerText = 'Wrong password!';
            }
        };

        async function loadBookings() {
            try {
                const querySnapshot = await getDocs(collection(db, 'bookings'));
                const bookings = [];
                querySnapshot.forEach(doc => {
                    bookings.push(doc.data());
                });
                
                document.getElementById('totalCount').innerText = bookings.length;
                
                const tbody = document.getElementById('bookingsTable');
                if (bookings.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7">No bookings yet</td></tr>';
                } else {
                    tbody.innerHTML = bookings.map(b => `
                        <tr>
                            <td style="padding: 8px; border-bottom: 1px solid #ddd;">${b.customerName || 'N/A'}</td>
                            <td style="padding: 8px; border-bottom: 1px solid #ddd;">${b.phone || 'N/A'}</td>
                            <td style="padding: 8px; border-bottom: 1px solid #ddd;">${b.aadhaar || 'N/A'}</td>
                            <td style="padding: 8px; border-bottom: 1px solid #ddd;">${b.dlNumber || 'N/A'}</td>
                            <td style="padding: 8px; border-bottom: 1px solid #ddd;">${b.startDate || 'N/A'}</td>
                            <td style="padding: 8px; border-bottom: 1px solid #ddd;">${b.days || 0}</td>
                            <td style="padding: 8px; border-bottom: 1px solid #ddd;">₹${b.totalAmount || 0}</td>
                        </tr>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading:', error);
                document.getElementById('bookingsTable').innerHTML = '<tr><td colspan="7">Error loading bookings</td></tr>';
            }
        }

        document.getElementById('logoutBtn').onclick = () => {
            document.getElementById('loginDiv').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('passwordInput').value = '';
        };
    </script>
</body>
</html>
