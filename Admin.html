<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Abotani Rentals</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div id="loginOverlay" class="fixed inset-0 bg-orange-600 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-80 text-center">
            <img src="logo.png" class="w-20 h-20 mx-auto mb-4 rounded-full border-2 border-orange-100" onerror="this.src='https://via.placeholder.com/80?text=AR'">
            <h2 class="text-xl font-bold mb-4">Admin Access</h2>
            <input type="password" id="adminPass" placeholder="Enter Password" class="w-full border p-2 rounded mb-4 text-center">
            <button onclick="checkAuth()" class="w-full bg-orange-600 text-white py-2 rounded-lg font-bold">Login</button>
        </div>
    </div>

    <div id="mainDashboard" class="hidden min-h-screen flex flex-col md:flex-row">
        
        <aside class="w-full md:w-64 bg-white shadow-md p-6">
            <div class="flex items-center space-x-3 mb-10">
                <img src="logo.png" class="w-10 h-10 rounded-full" onerror="this.src='https://via.placeholder.com/40?text=AR'">
                <span class="text-xl font-bold text-orange-600">Abotani Admin</span>
            </div>
            <nav class="space-y-4">
                <a href="#" class="block p-3 bg-orange-50 text-orange-700 rounded-lg font-medium">📊 Dashboard</a>
                <button onclick="location.reload()" class="block w-full text-left p-3 text-gray-600 hover:bg-gray-100 rounded-lg">🔄 Refresh Data</button>
                <a href="index.html" class="block p-3 text-gray-600 hover:bg-gray-100 rounded-lg">🌐 View Site</a>
            </nav>
        </aside>

        <main class="flex-1 p-6 md:p-10">
            <header class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-bold text-gray-800">Operational Overview</h2>
                <span id="lastUpdated" class="text-sm text-gray-400"></span>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-500">
                    <p class="text-gray-500 text-sm uppercase font-bold">Total Bookings</p>
                    <h3 id="totalBookings" class="text-3xl font-black text-gray-800">0</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500">
                    <p class="text-gray-500 text-sm uppercase font-bold">Total Revenue</p>
                    <h3 class="text-3xl font-black text-gray-800">₹<span id="totalRevenue">0</span></h3>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2 bg-white rounded-xl shadow-sm overflow-hidden">
                    <div class="p-4 border-b font-bold bg-gray-50 text-gray-700">Recent Confirmed Bookings</div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="text-xs uppercase bg-gray-100 text-gray-500">
                                    <th class="p-4">Customer</th>
                                    <th class="p-4">Vehicle/Date</th>
                                    <th class="p-4">Total</th>
                                    <th class="p-4">Action</th>
                                </tr>
                            </thead>
                            <tbody id="bookingsTable" class="divide-y">
                                </tbody>
                        </table>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm h-fit">
                    <h3 class="font-bold text-gray-700 mb-4 border-b pb-2">🚫 Block Dates</h3>
                    <p class="text-xs text-gray-500 mb-4">Select a date to prevent any scooty/bike bookings.</p>
                    <input type="date" id="blockDateInput" class="w-full border p-2 rounded mb-4">
                    <button id="blockBtn" class="w-full bg-red-500 text-white py-2 rounded-lg font-bold hover:bg-red-600">Block Date</button>
                    
                    <div class="mt-8">
                        <h4 class="text-sm font-bold text-gray-600 mb-2">Currently Blocked:</h4>
                        <ul id="blockedList" class="text-sm space-y-2">
                            </ul>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- CONFIGURATION (Match your index.html) ---
        const firebaseConfig = { /* PASTE YOUR FIREBASE CONFIG HERE */ };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- AUTH LOGIC ---
        window.checkAuth = () => {
            const pass = document.getElementById('adminPass').value;
            if(pass === "abotaniraga@123") {
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('mainDashboard').classList.remove('hidden');
                loadData();
            } else {
                alert("Incorrect Password!");
            }
        };

        // --- LOAD DATA ---
        async function loadData() {
            const bookingsTable = document.getElementById('bookingsTable');
            const blockedList = document.getElementById('blockedList');
            let totalRevenue = 0;
            let count = 0;

            // Load Bookings
            bookingsTable.innerHTML = "";
            const q = query(collection(db, "bookings"), orderBy("timestamp", "desc"));
            const querySnapshot = await getDocs(q);
            
            querySnapshot.forEach((d) => {
                const data = d.data();
                totalRevenue += Number(data.total);
                count++;

                bookingsTable.innerHTML += `
                    <tr>
                        <td class="p-4">
                            <div class="font-bold">${data.name}</div>
                            <div class="text-xs text-gray-400">${data.phone}</div>
                        </td>
                        <td class="p-4 text-sm">
                            <span class="bg-orange-100 text-orange-700 px-2 py-1 rounded text-xs font-bold">${data.vehicle}</span>
                            <div class="mt-1">${data.date}</div>
                        </td>
                        <td class="p-4 font-bold text-green-600">₹${data.total}</td>
                        <td class="p-4">
                            <button onclick="deleteBooking('${d.id}')" class="text-red-500 hover:underline text-xs">Delete</button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('totalBookings').innerText = count;
            document.getElementById('totalRevenue').innerText = totalRevenue.toLocaleString('en-IN');

            // Load Blocked Dates
            blockedList.innerHTML = "";
            const blockedSnap = await getDocs(collection(db, "blocked"));
            blockedSnap.forEach((d) => {
                blockedList.innerHTML += `
                    <li class="flex justify-between items-center bg-gray-50 p-2 rounded">
                        <span>${d.data().date}</span>
                        <button onclick="unblockDate('${d.id}')" class="text-red-400">✕</button>
                    </li>
                `;
            });

            document.getElementById('lastUpdated').innerText = "Last update: " + new Date().toLocaleTimeString();
        }

        // --- ACTIONS ---
        window.deleteBooking = async (id) => {
            if(confirm("Confirm deletion of this booking?")) {
                await deleteDoc(doc(db, "bookings", id));
                loadData();
            }
        };

        document.getElementById('blockBtn').onclick = async () => {
            const date = document.getElementById('blockDateInput').value;
            if(!date) return alert("Select a date");
            await addDoc(collection(db, "blocked"), { date: date });
            alert("Date blocked!");
            loadData();
        };

        window.unblockDate = async (id) => {
            await deleteDoc(doc(db, "blocked", id));
            loadData();
        };
    </script>
</body>
</html>
